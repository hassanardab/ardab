# Name of the workflow visible in the GitHub Actions tab
name: Build Android Debug APK

# Controls when the workflow will run
on:
  push:
    branches: ["main", "master"] # Triggers automatically on push to main or master
  workflow_dispatch: # Allows you to manually trigger the build from GitHub UI anytime

jobs:
  build-debug:
    # Runs on GitHub's fast, pre-configured Linux x86_64 servers
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull your repository code into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js v20 (Required by Expo/Metro for newer methods like toReversed)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Node 20 satisfies modern Expo & Metro requirements
          cache: "npm"

      # Step 3: Setup Java Development Kit (JDK 17 is required for modern React Native/Expo)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Step 4: Install your project dependencies from package.json
      - name: Install Dependencies
        run: npm install

      # Step 5: Compile the app into a Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          # assembleDebug builds the debug version of the app
          ./gradlew assembleDebug

      # Step 6: Package and upload the debug APK as a downloadable artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
