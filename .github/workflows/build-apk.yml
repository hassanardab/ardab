name: Build Android Debug APK

on:
  push:
    branches: ["main", "master"] # Change to your default branch if different
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Match your project's Node version
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # - name: Install Dependencies
      #   run: npm install

      # - name: Build Debug APK
      #   run: |
      #     cd android
      #     chmod +x gradlew
      #     ./gradlew assembleDebug

      # - name: Upload APK Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: debug-apk
      #     path: android/app/build/outputs/apk/debug/app-debug.apk
      # Step 5: Compile the app into an optimized Release APK
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          # assembleRelease builds the production-ready minified version
          ./gradlew assembleRelease

      # Step 6: Package and upload the release APK as a downloadable artifact
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
