# Name of the workflow visible in the GitHub Actions tab
name: Build Android Release APK

# Controls when the workflow will run
on:
  push:
    branches: ["main", "master"] # Triggers automatically on push to main or master
  workflow_dispatch: # Allows you to manually trigger the build from GitHub UI anytime

jobs:
  build-release:
    # Runs on GitHub's fast, pre-configured Linux x86_64 servers
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull your repository code into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js (CRITICAL: Required so Gradle can run node commands inside settings.gradle)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Match your project's Node version
          cache: "npm"

      # Step 3: Setup Java Development Kit (JDK 17 is required for modern React Native/Expo)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Step 4: Install your project dependencies from package.json
      - name: Install Dependencies
        run: npm install

      # Step 5: Compile the app into an optimized Release APK
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          # assembleRelease builds the production-ready minified version
          ./gradlew assembleRelease

      # Step 6: Package and upload the release APK as a downloadable artifact
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
